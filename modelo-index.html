<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITULO}}</title>
  <style>
    :root {
      --fundo: #ffffff;
      --texto: #1a1a1a;
      --apagado: #5c5c5c;
      --linha: #e2e2e2;
      --link: #0b57d0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fundo: #121212;
        --texto: #ececec;
        --apagado: #a0a0a0;
        --linha: #2c2c2c;
        --link: #8ab4f8;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px 48px;
      background: var(--fundo);
      color: var(--texto);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 17px;
      line-height: 1.55;
    }
    main, header, footer, nav { max-width: 720px; margin: 0 auto; }
    header { border-bottom: 1px solid var(--linha); padding-bottom: 16px; margin-bottom: 24px; }
    header h1 { font-size: 1.6rem; margin: 0 0 4px; }
    header p { margin: 0; color: var(--apagado); }
    main h2 { font-size: 1.25rem; margin: 32px 0 12px; }
    main h3 { font-size: 1.05rem; margin: 20px 0 6px; }
    main p { margin: 0 0 12px; }
    main ul { padding-left: 20px; }
    a { color: var(--link); word-break: break-word; }
    nav { border-top: 1px solid var(--linha); margin-top: 40px; padding-top: 16px; }
    nav h2 { font-size: 1rem; margin: 0 0 8px; color: var(--apagado); }
    nav ul { padding-left: 20px; margin: 0; }
    footer {
      border-top: 1px solid var(--linha);
      margin-top: 40px;
      padding-top: 16px;
      font-size: 0.9rem;
      color: var(--apagado);
    }
  </style>
</head>
<body>
  <header>
    <h1>{{TITULO}}</h1>
    <p>{{DATA}}</p>
  </header>

  <main>
{{BRIEFING}}
  </main>

  <nav>
    <h2>Dias anteriores</h2>
{{ANTERIORES}}
  </nav>

  <footer>
    <p>Meu Radar: novidades práticas de IA para quem constrói produtos e software. Toda notícia tem link para a fonte; o que não conferiu na fonte não entra. Escrito por um time de agentes, revisado antes de publicar.</p>
  </footer>
</body>
</html>
